[project]
name = "customer-compass-api-py"
version = "0.1.0"
description = "Customer Compass API (Python/FastAPI) — v2 stack migration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",  # web framework for the API
    "uvicorn[standard]>=0.32",  # server that runs FastAPI
    "asyncpg>=0.30",  # async Postgres driver
    "qdrant-client>=1.19.1",  # client for the Qdrant vector DB
    "python-frontmatter>=1.3.0",  # reads metadata headers from sample docs
    "httpx>=0.28.1",  # HTTP client for Ollama, OpenRouter and Google calls
    "mcp>=2.3.0",  # Model Context Protocol SDK (tool server + client)
    "alembic>=1.20.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "structlog>=26.1.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E501 is left to the formatter: long strings, SQL and comments are fine
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
files = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
