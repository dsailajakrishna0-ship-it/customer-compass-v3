[project]
name = "customer-compass-comparisons"
version = "0.1.0"
description = "Customer Compass comparison lab (E5): the same module built with LangChain and LangGraph"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langgraph>=1.2.19,<2",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.17.2"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # long strings and docstrings are fine

[tool.pytest.ini_options]
# one folder per approach, so each folder goes on the path (lab_common and the two approaches)
pythonpath = ["common", "tool-calling/withLangChain", "tool-calling/withLangGraph"]
testpaths = ["tests"]
